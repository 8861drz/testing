<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collective - Resource Management Platform</title>
    <style>
        /* CSS Variables for Theming */
        :root {
            --primary-hue: 220;  
            --accent-hue: 35;
            
            --bg-primary: hsl(var(--primary-hue), 15%, 98%);
            --bg-secondary: hsl(var(--primary-hue), 20%, 95%);
            --bg-tertiary: hsl(var(--primary-hue), 18%, 92%);
            
            --text-primary: hsl(var(--primary-hue), 30%, 12%);
            --text-secondary: hsl(var(--primary-hue), 15%, 35%);
            --text-tertiary: hsl(var(--primary-hue), 10%, 55%);
            
            --accent-primary: hsl(var(--accent-hue), 75%, 48%);
            --accent-secondary: hsl(var(--accent-hue), 85%, 38%);
            --accent-light: hsl(var(--accent-hue), 70%, 92%);
            
            --border-color: hsl(var(--primary-hue), 15%, 85%);
            --shadow-color: hsl(var(--primary-hue), 30%, 12%);
            
            --brand-font: 'Georgia', 'Times New Roman', serif;
            --display-font: 'Courier New', 'Courier', monospace;
            --body-font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            
            --spacing-unit: 1.25rem;
            --border-radius: 2px;
            --transition-speed: 0.3s;
        }

        [data-theme="dark"] {
            --bg-primary: hsl(var(--primary-hue), 20%, 8%);
            --bg-secondary: hsl(var(--primary-hue), 22%, 12%);
            --bg-tertiary: hsl(var(--primary-hue), 20%, 16%);
            
            --text-primary: hsl(var(--primary-hue), 15%, 95%);
            --text-secondary: hsl(var(--primary-hue), 12%, 75%);
            --text-tertiary: hsl(var(--primary-hue), 8%, 55%);
            
            --border-color: hsl(var(--primary-hue), 15%, 25%);
            --shadow-color: hsl(0, 0%, 0%);
        }

        [data-theme="nature"] {
            --primary-hue: 140;
            --accent-hue: 85;
            --bg-primary: hsl(140, 25%, 96%);
            --bg-secondary: hsl(140, 30%, 92%);
            --accent-primary: hsl(85, 60%, 45%);
        }

        [data-theme="sunset"] {
            --primary-hue: 15;
            --accent-hue: 340;
            --bg-primary: hsl(15, 30%, 96%);
            --bg-secondary: hsl(15, 35%, 92%);
            --accent-primary: hsl(340, 75%, 55%);
        }

        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--body-font);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--brand-font);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: calc(var(--spacing-unit) * 0.5);
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            letter-spacing: -0.02em;
        }

        h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            letter-spacing: -0.01em;
        }

        h3 {
            font-size: clamp(1.25rem, 3vw, 1.75rem);
        }

        .mono {
            font-family: var(--display-font);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-size: 0.875rem;
        }

        /* Header and Navigation */
        header {
            background: var(--bg-secondary);
            border-bottom: 3px solid var(--accent-primary);
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: all var(--transition-speed);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: calc(var(--spacing-unit) * 1.5) var(--spacing-unit);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--spacing-unit);
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: calc(var(--spacing-unit) * 0.5);
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2rem);
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--display-font);
            font-weight: bold;
            color: white;
            font-size: 1.5rem;
        }

        nav {
            display: flex;
            gap: calc(var(--spacing-unit) * 0.75);
            flex-wrap: wrap;
        }

        .nav-btn {
            background: transparent;
            border: 2px solid var(--border-color);
            color: var(--text-primary);
            padding: calc(var(--spacing-unit) * 0.5) calc(var(--spacing-unit) * 0.75);
            cursor: pointer;
            font-family: var(--display-font);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: all var(--transition-speed);
            border-radius: var(--border-radius);
        }

        .nav-btn:hover {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px hsla(var(--accent-hue), 75%, 48%, 0.3);
        }

        .nav-btn.active {
            background: var(--text-primary);
            border-color: var(--text-primary);
            color: var(--bg-primary);
        }

        /* Controls Panel */
        .controls-panel {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: var(--spacing-unit);
            animation: slideDown 0.4s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .controls-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: calc(var(--spacing-unit) * 1.5);
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: calc(var(--spacing-unit) * 0.25);
        }

        .control-group label {
            font-family: var(--display-font);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
        }

        .control-group select,
        .control-group input {
            padding: calc(var(--spacing-unit) * 0.4) calc(var(--spacing-unit) * 0.6);
            border: 2px solid var(--border-color);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--body-font);
            font-size: 0.875rem;
            border-radius: var(--border-radius);
            transition: all var(--transition-speed);
        }

        .control-group select:focus,
        .control-group input:focus {
            outline: none;
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        /* Main Container */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: calc(var(--spacing-unit) * 2) var(--spacing-unit);
            min-height: calc(100vh - 200px);
        }

        /* Loading and Error States */
        .loading, .error, .empty-state {
            text-align: center;
            padding: calc(var(--spacing-unit) * 4);
            font-family: var(--display-font);
            font-size: 1.25rem;
            color: var(--text-secondary);
        }

        .spinner {
            width: 60px;
            height: 60px;
            margin: 0 auto calc(var(--spacing-unit) * 1.5);
            border: 4px solid var(--border-color);
            border-top-color: var(--accent-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Layout: Grid - Default for Posts */
        .layout-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: calc(var(--spacing-unit) * 1.5);
        }

        /* Layout: Masonry for Photos/Albums */
        .layout-masonry {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--spacing-unit);
            grid-auto-flow: dense;
        }

        /* Layout: List for Todos/Comments */
        .layout-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-unit);
            max-width: 900px;
        }

        /* Layout: Magazine for Featured Content */
        .layout-magazine {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: calc(var(--spacing-unit) * 1.5);
        }

        .layout-magazine > :first-child {
            grid-column: span 12;
        }

        .layout-magazine > :nth-child(2) {
            grid-column: span 8;
        }

        .layout-magazine > :nth-child(3) {
            grid-column: span 4;
        }

        .layout-magazine > :nth-child(n+4) {
            grid-column: span 4;
        }

        @media (max-width: 968px) {
            .layout-magazine > * {
                grid-column: span 12 !important;
            }
        }

        /* Card Styles */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            padding: calc(var(--spacing-unit) * 1.5);
            transition: all var(--transition-speed);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out backwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px hsla(var(--shadow-color), 0.1);
            border-color: var(--accent-primary);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-primary);
            transform: scaleY(0);
            transition: transform var(--transition-speed);
        }

        .card:hover::before {
            transform: scaleY(1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: var(--spacing-unit);
            gap: var(--spacing-unit);
        }

        .card-title {
            font-size: 1.25rem;
            margin: 0;
            flex: 1;
        }

        .card-id {
            font-family: var(--display-font);
            font-size: 0.75rem;
            color: var(--text-tertiary);
            background: var(--bg-tertiary);
            padding: 0.25rem 0.5rem;
            border-radius: var(--border-radius);
        }

        .card-body {
            color: var(--text-secondary);
            margin-bottom: var(--spacing-unit);
        }

        .card-footer {
            display: flex;
            gap: calc(var(--spacing-unit) * 0.5);
            flex-wrap: wrap;
            padding-top: var(--spacing-unit);
            border-top: 1px solid var(--border-color);
        }

        .badge {
            font-family: var(--display-font);
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            background: var(--accent-light);
            color: var(--accent-secondary);
            border-radius: var(--border-radius);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge.completed {
            background: hsl(140, 50%, 90%);
            color: hsl(140, 60%, 30%);
        }

        .badge.pending {
            background: hsl(35, 70%, 90%);
            color: hsl(35, 70%, 35%);
        }

        /* Photo Card Specific */
        .photo-card {
            aspect-ratio: 1;
            padding: 0;
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-speed);
        }

        .photo-card:hover img {
            transform: scale(1.05);
        }

        .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, hsla(0, 0%, 0%, 0.8), transparent);
            padding: var(--spacing-unit);
            color: white;
            transform: translateY(100%);
            transition: transform var(--transition-speed);
        }

        .photo-card:hover .photo-overlay {
            transform: translateY(0);
        }

        /* User Card */
        .user-card {
            text-align: center;
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-family: var(--brand-font);
            color: white;
            margin: 0 auto var(--spacing-unit);
        }

        .user-info {
            margin-bottom: var(--spacing-unit);
        }

        .user-name {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .user-username {
            color: var(--text-tertiary);
            font-family: var(--display-font);
            font-size: 0.875rem;
        }

        .user-contact {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* Album Card */
        .album-preview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: var(--spacing-unit);
            aspect-ratio: 1;
            overflow: hidden;
            border-radius: var(--border-radius);
        }

        .album-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            padding: calc(var(--spacing-unit) * 2) var(--spacing-unit);
            margin-top: calc(var(--spacing-unit) * 4);
            text-align: center;
            color: var(--text-tertiary);
        }

        footer p {
            font-family: var(--display-font);
            font-size: 0.875rem;
            letter-spacing: 0.05em;
        }

        /* Animations with delays for staggered effect */
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }
        .card:nth-child(6) { animation-delay: 0.3s; }
        .card:nth-child(n+7) { animation-delay: 0.35s; }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                align-items: flex-start;
            }

            nav {
                width: 100%;
            }

            .nav-btn {
                flex: 1;
            }

            .controls-content {
                flex-direction: column;
                align-items: stretch;
            }

            .control-group {
                width: 100%;
            }

            .layout-grid,
            .layout-masonry {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body data-theme="light">
    <header>
        <div class="header-content">
            <div class="brand">
                <div class="brand-icon">C</div>
                <h1>Collective</h1>
            </div>
            <nav id="mainNav">
                <button class="nav-btn active" data-resource="posts">Posts</button>
                <button class="nav-btn" data-resource="comments">Comments</button>
                <button class="nav-btn" data-resource="albums">Albums</button>
                <button class="nav-btn" data-resource="photos">Photos</button>
                <button class="nav-btn" data-resource="todos">Todos</button>
                <button class="nav-btn" data-resource="users">Users</button>
            </nav>
        </div>
    </header>

    <div class="controls-panel">
        <div class="controls-content">
            <div class="control-group">
                <label for="layoutSelect">Layout</label>
                <select id="layoutSelect">
                    <option value="grid">Grid</option>
                    <option value="masonry">Masonry</option>
                    <option value="list">List</option>
                    <option value="magazine">Magazine</option>
                </select>
            </div>
            <div class="control-group">
                <label for="themeSelect">Theme</label>
                <select id="themeSelect">
                    <option value="light">Light</option>
                    <option value="dark">Dark</option>
                    <option value="nature">Nature</option>
                    <option value="sunset">Sunset</option>
                </select>
            </div>
            <div class="control-group">
                <label for="limitInput">Limit</label>
                <input type="number" id="limitInput" value="10" min="1" max="100">
            </div>
            <div class="control-group">
                <label>&nbsp;</label>
                <button class="nav-btn" id="refreshBtn">Refresh Data</button>
            </div>
        </div>
    </div>

    <main id="mainContent">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading resources...</p>
        </div>
    </main>

    <footer>
        <p>Collective &copy; 2026 | Resource Management Platform</p>
    </footer>

    <script>
        // Application State
        const state = {
            currentResource: 'posts',
            currentLayout: 'grid',
            currentTheme: 'light',
            limit: 10,
            data: {},
            cache: {}
        };

        // API Base URL
        const API_BASE = 'https://jsonplaceholder.typicode.com';

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            initializeEventListeners();
            loadResource(state.currentResource);
        });

        // Event Listeners
        function initializeEventListeners() {
            // Navigation buttons
            document.querySelectorAll('.nav-btn[data-resource]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const resource = e.target.dataset.resource;
                    switchResource(resource);
                });
            });

            // Layout selector
            document.getElementById('layoutSelect').addEventListener('change', (e) => {
                state.currentLayout = e.target.value;
                renderContent();
            });

            // Theme selector
            document.getElementById('themeSelect').addEventListener('change', (e) => {
                state.currentTheme = e.target.value;
                document.body.setAttribute('data-theme', e.target.value);
            });

            // Limit input
            document.getElementById('limitInput').addEventListener('change', (e) => {
                state.limit = parseInt(e.target.value) || 10;
                loadResource(state.currentResource);
            });

            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', () => {
                state.cache = {};
                loadResource(state.currentResource);
            });
        }

        // Switch Resource
        function switchResource(resource) {
            state.currentResource = resource;
            
            // Update active nav button
            document.querySelectorAll('.nav-btn[data-resource]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.resource === resource);
            });

            // Auto-select appropriate layout
            const layoutMap = {
                posts: 'grid',
                comments: 'list',
                albums: 'grid',
                photos: 'masonry',
                todos: 'list',
                users: 'grid'
            };
            
            state.currentLayout = layoutMap[resource] || 'grid';
            document.getElementById('layoutSelect').value = state.currentLayout;

            loadResource(resource);
        }

        // Load Resource Data
        async function loadResource(resource) {
            const mainContent = document.getElementById('mainContent');
            
            // Show loading state
            mainContent.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Loading ${resource}...</p>
                </div>
            `;

            try {
                // Check cache
                const cacheKey = `${resource}-${state.limit}`;
                if (state.cache[cacheKey]) {
                    state.data[resource] = state.cache[cacheKey];
                    renderContent();
                    return;
                }

                // Fetch data
                const response = await fetch(`${API_BASE}/${resource}?_limit=${state.limit}`);
                if (!response.ok) throw new Error('Failed to fetch data');
                
                const data = await response.json();
                
                // For albums and photos, we need additional data
                if (resource === 'albums') {
                    data.forEach(async (album, index) => {
                        const photosResponse = await fetch(`${API_BASE}/albums/${album.id}/photos?_limit=4`);
                        const photos = await photosResponse.json();
                        data[index].photos = photos;
                        if (index === data.length - 1) {
                            state.data[resource] = data;
                            state.cache[cacheKey] = data;
                            renderContent();
                        }
                    });
                    return;
                }

                state.data[resource] = data;
                state.cache[cacheKey] = data;
                renderContent();

            } catch (error) {
                mainContent.innerHTML = `
                    <div class="error">
                        <p>⚠️ Error loading ${resource}</p>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // Render Content
        function renderContent() {
            const mainContent = document.getElementById('mainContent');
            const data = state.data[state.currentResource];

            if (!data || data.length === 0) {
                mainContent.innerHTML = `
                    <div class="empty-state">
                        <p>No ${state.currentResource} found</p>
                    </div>
                `;
                return;
            }

            const layoutClass = `layout-${state.currentLayout}`;
            const cardsHTML = data.map(item => renderCard(item, state.currentResource)).join('');

            mainContent.innerHTML = `<div class="${layoutClass}">${cardsHTML}</div>`;
        }

        // Render Individual Card
        function renderCard(item, resource) {
            switch (resource) {
                case 'posts':
                    return renderPostCard(item);
                case 'comments':
                    return renderCommentCard(item);
                case 'albums':
                    return renderAlbumCard(item);
                case 'photos':
                    return renderPhotoCard(item);
                case 'todos':
                    return renderTodoCard(item);
                case 'users':
                    return renderUserCard(item);
                default:
                    return '';
            }
        }

        // Card Renderers
        function renderPostCard(post) {
            return `
                <article class="card">
                    <div class="card-header">
                        <h3 class="card-title">${post.title}</h3>
                        <span class="card-id">#${post.id}</span>
                    </div>
                    <div class="card-body">
                        <p>${post.body}</p>
                    </div>
                    <div class="card-footer">
                        <span class="badge">User ${post.userId}</span>
                    </div>
                </article>
            `;
        }

        function renderCommentCard(comment) {
            return `
                <article class="card">
                    <div class="card-header">
                        <h3 class="card-title">${comment.name}</h3>
                        <span class="card-id">#${comment.id}</span>
                    </div>
                    <div class="card-body">
                        <p>${comment.body}</p>
                    </div>
                    <div class="card-footer">
                        <span class="badge">${comment.email}</span>
                        <span class="badge">Post ${comment.postId}</span>
                    </div>
                </article>
            `;
        }

        function renderAlbumCard(album) {
            const photosHTML = album.photos ? 
                album.photos.slice(0, 4).map(photo => 
                    `<img src="${photo.thumbnailUrl}" alt="${photo.title}">`
                ).join('') : '';

            return `
                <article class="card">
                    <div class="card-header">
                        <h3 class="card-title">${album.title}</h3>
                        <span class="card-id">#${album.id}</span>
                    </div>
                    ${photosHTML ? `<div class="album-preview">${photosHTML}</div>` : ''}
                    <div class="card-footer">
                        <span class="badge">User ${album.userId}</span>
                    </div>
                </article>
            `;
        }

        function renderPhotoCard(photo) {
            return `
                <article class="card photo-card">
                    <img src="${photo.url}" alt="${photo.title}">
                    <div class="photo-overlay">
                        <div class="mono">#${photo.id}</div>
                        <div>${photo.title}</div>
                    </div>
                </article>
            `;
        }

        function renderTodoCard(todo) {
            const statusBadge = todo.completed ? 
                '<span class="badge completed">Completed</span>' : 
                '<span class="badge pending">Pending</span>';

            return `
                <article class="card">
                    <div class="card-header">
                        <h3 class="card-title">${todo.title}</h3>
                        <span class="card-id">#${todo.id}</span>
                    </div>
                    <div class="card-footer">
                        ${statusBadge}
                        <span class="badge">User ${todo.userId}</span>
                    </div>
                </article>
            `;
        }

        function renderUserCard(user) {
            const initials = user.name.split(' ').map(n => n[0]).join('');
            return `
                <article class="card user-card">
                    <div class="user-avatar">${initials}</div>
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-username">@${user.username}</div>
                    </div>
                    <div class="user-contact">
                        <div>${user.email}</div>
                        <div>${user.phone}</div>
                    </div>
                    <div class="card-footer">
                        <span class="badge">${user.company.name}</span>
                    </div>
                </article>
            `;
        }
    </script>
</body>
</html>
